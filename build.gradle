apply from: './versionsPlugin.gradle'

buildscript {
    repositories {
        google()
        jcenter()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:3.5.0-beta03'
        classpath GradlePlugins.kotlinPlugin
        classpath GradlePlugins.versionsPlugin
        classpath GradlePlugins.butterKnifePlugin
    }
}

allprojects {
    repositories {
        google()
        jcenter()

    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
